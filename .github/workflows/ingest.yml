name: Scheduled Data Ingestion

on:
  schedule:
    # Runs daily at 00:00 UTC (8:00 AM UTC+8 / PHT)
    # Adjust cron schedule to match your preferred frequency:
    # ┌───────────── minute (0 - 59)
    # │ ┌───────────── hour (0 - 23)
    # │ │ ┌───────────── day of the month (1 - 31)
    # │ │ │ ┌───────────── month (1 - 12)
    # │ │ │ │ ┌───────────── day of the week (0 - 6) (Sunday to Saturday)
    - cron: "15 0 * * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Grants permission to commit and push changes back to the repo

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion script
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: |
          python scripts/ingest.py

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage any new or appended files under data/raw
          git add data/raw/
          
          # Only commit and push if there are changes
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "chore(data): automated ingestion $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
